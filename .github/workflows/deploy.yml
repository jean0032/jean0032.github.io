on:
  # Runs on pushes targeting the `main` branch. Change this to `master` if you're
  # using the `master` branch as the default branch.
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm i # or pnpm install / yarn install / bun install

      - name: Build
        run: |
          pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: public
          retention-days: 1

  # Deployment job
  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: public
    
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        if: success()

      - name: Setup Deploy Private Key
        env:
          HEXO_DEPLOY_PRIVATE_KEY: ${{ secrets.HEXO_DEPLOY_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh/
          echo "$HEXO_DEPLOY_PRIVATE_KEY" > ~/.ssh/id_rsa 
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan hnsac.com >> ~/.ssh/known_hosts

      - name: Setup Git Infomation
        run: | 
          git config --global user.name 'jean0032' 
          git config --global user.email 'jean0032@gmail.com'
          
      - name: Deploy to hnsac.com
        run: |
          cd public
          git config --global init.defaultBranch main
          git init
          git add .
          git commit -m "Deploy $(date)"
          git push -f git@hnsac.com:/home/git/blog.git HEAD:main

      - name: Cleanup after job
        if: always()
        run: rm -rf public/*
