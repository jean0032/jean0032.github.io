# workflow name
name: Publish

# master branch on push, auto run
on: 
  push:
    branches:
      - main
      
jobs:
  build: 
    runs-on: ubuntu-latest 
        
    steps:
    # check it to your workflow can access it
    # from: https://github.com/actions/checkout
    - name: Checkout Repository master branch
      uses: actions/checkout@master 
      
    # from: https://github.com/actions/setup-node  
    - name: Setup Node.js 22.x
      uses: actions/setup-node@master
      with:
        node-version: "22.x"
    
    - name: Setup Hexo Dependencies
      run: |
        npm install hexo-cli -g
        npm install hexo-generator-tag --save
    
    - name: Setup Deploy Private Key
      env:
        HEXO_DEPLOY_PRIVATE_KEY: ${{ secrets.HEXO_DEPLOY_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh/
        echo "$HEXO_DEPLOY_PRIVATE_KEY" > ~/.ssh/id_rsa 
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan hnsac.com >> ~/.ssh/known_hosts
                
    - name: Setup Git Infomation
      run: | 
        git config --global user.name 'jean0032' 
        git config --global user.email 'jean0032@gmail.com'
    - name: Deploy Hexo 
      run: |
        hexo clean
        hexo generate 
        cd public
        git init
        git remote add origin git@hnsac.com:/home/git/blog.git
        git add .
        git commit -m "Deploy by GitHub Actions: ${{ github.sha }}"
        git push -f origin HEAD:main
