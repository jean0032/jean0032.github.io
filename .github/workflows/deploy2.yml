name: Hexo Deploy to Custom Git

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm i

      - name: Build Hexo
        run: pnpm build 

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        env:
          GIT_USERNAME: "jean0032"
          GIT_EMAIL: "jean0032@gmail.com"
        run: |
          git config --global user.name "$GIT_USERNAME"
          git config --global user.email "$GIT_EMAIL"

      - name: Setup SSH Key
        env:
          HEXO_DEPLOY_PRIVATE_KEY: ${{ secrets.HEXO_DEPLOY_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh/
          echo "$HEXO_DEPLOY_PRIVATE_KEY" > ~/.ssh/id_rsa 
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan hnsac.com >> ~/.ssh/known_hosts

      - name: Push to Custom Git
        run: |
          cd public
          git init
          git remote add origin git@hnsac.com:/home/git/blog.git
          git add .
          git commit -m "Deploy by GitHub Actions: ${{ github.sha }}"
          git push -f origin HEAD:main
